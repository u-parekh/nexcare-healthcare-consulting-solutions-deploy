name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: nexcare_ci
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ci-only-secret
      IP_HASH_SALT: ci-only-salt
      # Google's public reCAPTCHA *test* secret - not a real credential
      RECAPTCHA_SECRET_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python -m flake8 backend --max-line-length 160 --exclude backend/tests || true
      # backend_test.py is a live-deployment suite: it is skipped unless TEST_BASE_URL is set.
      - run: cd backend && python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install dependencies (yarn if a yarn.lock is committed, otherwise npm)
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci --legacy-peer-deps
          else npm install --legacy-peer-deps --no-audit --no-fund; fi
      - run: npx eslint src
      - run: npx craco build
        env:
          GENERATE_SOURCEMAP: "false"
          REACT_APP_BACKEND_URL: https://api.example.com
          REACT_APP_RECAPTCHA_SITE_KEY: ci-placeholder
